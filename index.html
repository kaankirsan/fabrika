<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Sanal Fabrika</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f1419'/%3E%3Cpath d='M3 13V7l3 2V7l3 2V4h4v9z' fill='%23f2c200'/%3E%3C/svg%3E">
<meta name="description" content="Kaan Kırşan'ın otomasyon projelerinin 3B kabataslak modelleri: gezilebilir, elle kontrol edilebilir sanal fabrika.">
<!-- Addon dosyaları 'three' bare specifier'ını import eder -> importmap ŞART.
     three r184: three.module.js aynı klasördeki three.core.js'i göreli import eder. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/"
  }
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="ust">
  <div class="marka">
    <span class="logo">◧</span>
    <div>
      <div class="baslik">SANAL FABRİKA</div>
      <div class="alt">Kaan Kırşan · otomasyon projeleri · kabataslak 3B modeller</div>
    </div>
  </div>
  <div class="bosluk"></div>
  <button id="btn-genel" class="dugme">Genel bakış</button>
  <button id="btn-saha" class="dugme">Dış saha</button>
  <button id="btn-vr" class="dugme vr" hidden>VR'a gir</button>
  <label class="anahtar"><input type="checkbox" id="chk-etiket" checked> Etiketler</label>
  <label class="anahtar"><input type="checkbox" id="chk-golge" checked> Gölgeler</label>
</header>

<nav id="liste" aria-label="Makineler"></nav>

<aside id="panel" hidden>
  <div id="panel-ic"></div>
</aside>

<div id="ipucu">
  <b>Sol tık</b> döndür · <b>sağ tık</b> kaydır · <b>teker</b> yakınlaş · <b>W A S D</b> yürü ·
  <b>makineye tıkla</b> seç · <b>Q / E</b> önceki / sonraki makine · <b>Esc</b> genel bakış
</div>
<div id="tooltip" hidden></div>
<div id="yukleniyor">Fabrika kuruluyor…</div>

<canvas id="sahne"></canvas>

<script type="module" src="js/main.js"></script>
</body>
</html>
